name: Module version change check

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - 19.0

jobs:
  ensure_module_version_changed:
    runs-on: ubuntu-latest
    name: Ensure module version changed
    steps:
      - uses: actions/checkout@v7
      - name: Ensure module version changed
        id: changed-files
        with:
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 1
          files_ignore: '.*'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
      - name: List all changed modules
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          git clone https://github.com/${{github.repository}} --branch=19.0 --depth=1 main
          for dir in ${ALL_CHANGED_FILES}; do
            if [ -f "${dir}/__manifest__.py" ]; then
              echo "$dir module was changed"
              version_in_branch=$(grep 'version' "${dir}/__manifest__.py" | awk '{print($2)}')
              echo "Version ${version_in_branch} in module ${dir}"
              version_in_main=$(grep 'version' "main/${dir}/__manifest__.py" | awk '{print($2)}' || echo "")
              echo "Version ${version_in_main} in main"
            else
              echo "Ignoring directory ${dir} as it does not contain __manifest__.py"
            fi
          done



